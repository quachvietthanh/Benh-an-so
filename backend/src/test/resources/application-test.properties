# ==========================================================
# Test Profile: H2 In-Memory Database with Flyway
# ==========================================================

# Use H2 in-memory for tests - override MySQL defaults
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate - use H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway with H2
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# H2 Console disabled in tests
spring.h2.console.enabled=false

# JWT for test context
app.jwt.secret=TEST_SECRET_32_CHARS_LONG_FOR_TEST_ONLY_!!
app.jwt.expiration-ms=3600000
